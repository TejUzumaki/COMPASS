<!DOCTYPE html>
<html lang="en">

<title>COMPASS — Charting Maths, One Angle at a Time</title>
<meta name="description" content="COMPASS is an interactive maths teaching platform for smartboards — functions, trigonometry, vectors, conic sections, calculus, made visible on a chalkboard.">

<style>
:root {
  /* COMPASS chalkboard palette */
  --bg-deep: #07150e;
  --bg-mid: #0f2a1f;
  --bg-bright: #1a4a2a;
  --bg-panel: rgba(20,52,38,0.97);
  --border: rgba(245,245,240,0.18);
  --border-hi: rgba(245,245,240,0.38);
  --chalk: #f5f5f0;
  --cyan: #f5f5f0;        /* kept for compat with old CSS */
  --lime: #9fb89f;
  --orange: #f0e19a;
  --purple: #f0c4d4;
  --text: #f5f5f0;
  --muted: rgba(245,245,240,0.68);
  --dim: rgba(245,245,240,0.40);
  --mono: 'Space Mono', monospace;
  --ui: 'Syne', sans-serif;
  --touch-sm: 56px;
  --touch-md: 64px;
  --touch-lg: 72px;
  --topbar-h: 72px;
  --radius: 14px;
  --radius-sm: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:var(--bg-mid);
  color:var(--text);
  font-family:var(--ui);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
#bg-particles{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{
  position:relative;z-index:1;width:100vw;height:100vh;overflow:hidden;
  /* Radial chalkboard spotlight — brighter middle, darker edges */
  background: radial-gradient(ellipse at 50% 45%,
              #1a4a2a 0%,
              #0f2a1f 50%,
              #07150e 100%);
}
#canvas-container{position:absolute;inset:0; touch-action:none;}

/* TOP BAR */
#top-bar{
  position:absolute;top:0;left:0;right:0;
  height:var(--topbar-h);
  display:flex;align-items:center;
  padding:0 28px;gap:14px;
  background:linear-gradient(180deg,rgba(15,42,31,.96) 0%,transparent 100%);
  z-index:100;pointer-events:none;
}
.tb-logo{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--chalk);letter-spacing:3px;display:flex;align-items:center;gap:9px}
.tb-dot{width:8px;height:8px;border-radius:50%;background:var(--chalk);box-shadow:0 0 10px var(--chalk)}
.tb-div{width:1px;height:28px;background:var(--border)}
#sim-title{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text)}
#sim-subtitle{font-family:var(--mono);font-size:11px;color:var(--muted);padding:3px 12px;background:rgba(245,245,240,.05);border:1px solid var(--border);border-radius:100px}
#view-badge{pointer-events:all;font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:4px 12px;border-radius:100px;background:rgba(159,184,159,.15);border:1px solid rgba(159,184,159,.3);color:var(--lime);cursor:default}
#view-badge.mode-3d{background:rgba(240,196,212,.15);border-color:rgba(240,196,212,.3);color:var(--purple)}
#mode-badge{
  margin-left:auto;pointer-events:all;
  display:flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:100px;
  border:1px solid var(--border);background:rgba(245,245,240,.04);
  font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;transition:all .2s;
}
#mode-badge.student{background:rgba(159,184,159,.1);border-color:rgba(159,184,159,.3);color:var(--lime)}
#mode-badge:active{transform:scale(.95)}

#pause-indicator{position:absolute;top:calc(var(--topbar-h)+16px);left:50%;transform:translateX(-50%);background:var(--orange);color:#1a3a26;font-family:var(--mono);font-size:13px;font-weight:700;padding:10px 28px;border-radius:100px;z-index:120;display:none;box-shadow:0 0 28px rgba(240,225,154,.55),0 4px 16px rgba(0,0,0,.4);letter-spacing:2px;text-transform:uppercase}

.rh{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(245,245,240,.18);transform:scale(0);animation:rp .55s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}

/* FAB CLUSTER (legacy — only used as source container) */
#fab-cluster{position:absolute;bottom:32px;right:32px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.fab{border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .2s,box-shadow .2s}
.fab:active{transform:scale(.91)}
.fab-main{width:var(--touch-lg);height:var(--touch-lg);font-size:22px;background:var(--chalk);color:#0f2a1f;box-shadow:0 6px 24px rgba(245,245,240,.45),0 2px 8px rgba(0,0,0,.5)}
.fab-main.open{background:rgba(245,245,240,.12);color:var(--chalk);border:1.5px solid var(--chalk);box-shadow:0 0 0 4px rgba(245,245,240,.12)}
.fab-sec{width:var(--touch-sm);height:var(--touch-sm);font-size:18px;background:var(--bg-panel);border:1px solid var(--border);color:var(--muted);box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(16px) scale(.85);transition:opacity .22s,transform .22s,background .15s,color .15s,border-color .15s}
.fab-sec.vis{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.fab-sec.on{background:rgba(245,245,240,.12);color:var(--chalk);border-color:rgba(245,245,240,.35)}
.fab-sec.paused{background:rgba(240,225,154,.12);color:var(--orange);border-color:rgba(240,225,154,.35)}
.fab-sec.ghost-on{background:rgba(159,184,159,.12);color:var(--lime);border-color:rgba(159,184,159,.35)}
.fab-row{display:flex;align-items:center;gap:12px}
.fab-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg-panel);border:1px solid var(--border);padding:5px 12px;border-radius:100px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.fab-row.vis .fab-lbl{opacity:1}

/* FLOATING ISLAND PANELS */
#backdrop{display:none}
#sim-sheet{
  position:fixed;bottom:20px;left:50%;z-index:300;
  width:calc(100% - 40px);max-width:480px;max-height:70vh;
  background:var(--bg-panel);border:1px solid var(--border);
  border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);
  transform:translateX(-50%) translateY(calc(100% + 40px));
  transition:transform .35s cubic-bezier(.32,1,.32,1);
  display:flex;flex-direction:column;overflow:hidden;
}
#sim-sheet.open{transform:translateX(-50%) translateY(0)}
.sh-handle-wrap{display:flex;justify-content:center;padding:12px 0 4px;flex-shrink:0}
.sh-handle{width:40px;height:4px;background:rgba(245,245,240,.15);border-radius:2px}
.sh-header{display:flex;align-items:center;justify-content:space-between;padding:8px 28px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sh-title{font-family:var(--mono);font-size:11px;color:var(--chalk);text-transform:uppercase;letter-spacing:.15em}
.sh-close{width:var(--touch-sm);height:var(--touch-sm);border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sh-close:active{background:rgba(245,245,240,.07)}
#sim-grid{padding:16px 20px 36px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}
#sim-grid::-webkit-scrollbar{width:4px}
#sim-grid::-webkit-scrollbar-thumb{background:rgba(245,245,240,.2);border-radius:2px}
.grid-sec-label{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.2em;padding:12px 4px 6px}
.sim-tile{display:flex;align-items:center;gap:16px;min-height:var(--touch-md);padding:12px 18px;background:rgba(245,245,240,.03);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;border-left:3px solid transparent;transition:all .18s;text-align:left;width:100%;-webkit-tap-highlight-color:transparent}
.sim-tile:active{background:rgba(245,245,240,.06)}
.sim-tile.active{background:rgba(245,245,240,.07);border-left-color:var(--chalk);border-color:rgba(245,245,240,.15)}
.st-icon{width:44px;height:44px;border-radius:10px;background:rgba(245,245,240,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sim-tile.active .st-icon{background:rgba(245,245,240,.15);border-color:rgba(245,245,240,.3)}
.st-name{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--text);display:block;margin-bottom:2px}
.sim-tile.active .st-name{color:var(--chalk)}
.st-formula{font-family:var(--mono);font-size:10px;color:var(--dim)}
.sim-tile.active .st-formula{color:rgba(245,245,240,.5)}
.st-check{width:22px;height:22px;border-radius:50%;background:var(--chalk);display:none;align-items:center;justify-content:center;font-size:11px;color:#0f2a1f;font-weight:700;flex-shrink:0}
.sim-tile.active .st-check{display:flex}

/* FLOATING DRAWERS */
.drawer{
  position:fixed;top:50%;z-index:300;
  background:var(--bg-panel);
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transition:transform .35s cubic-bezier(.32,1,.32,1);
}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:var(--topbar-h);border-bottom:1px solid var(--border);flex-shrink:0;border-radius:20px 20px 0 0}
.drawer-ttl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.15em}
.drawer-x{width:var(--touch-sm);height:var(--touch-sm);border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.drawer-x:active{background:rgba(245,245,240,.07)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-body::-webkit-scrollbar{width:4px}
.drawer-body::-webkit-scrollbar-thumb{border-radius:2px}

#ctrl-drawer{right:20px;width:340px;max-height:75vh;transform:translateY(-50%) translateX(calc(100% + 40px))}
#ctrl-drawer.open{transform:translateY(-50%) translateX(0)}
#ctrl-drawer .drawer-ttl{color:var(--chalk)}
#ctrl-drawer .drawer-body::-webkit-scrollbar-thumb{background:rgba(245,245,240,.2)}

#info-drawer{left:20px;width:380px;max-height:75vh;transform:translateY(-50%) translateX(calc(-100% - 40px))}
#info-drawer.open{transform:translateY(-50%) translateX(0)}
#info-drawer .drawer-ttl{color:var(--lime)}
#info-drawer .drawer-body::-webkit-scrollbar-thumb{background:rgba(159,184,159,.2)}

/* GUI */
#gui-container{position:static!important}
.lil-gui{--background-color:transparent!important;--text-color:#f5f5f0!important;--title-background-color:rgba(245,245,240,.06)!important;--title-text-color:#f5f5f0!important;--widget-color:rgba(245,245,240,0.08)!important;--hover-color:rgba(245,245,240,0.13)!important;--focus-color:rgba(245,245,240,.25)!important;--number-color:#9fb89f!important;--string-color:#f0e19a!important;--font-family:'Syne',sans-serif!important;--font-size:14px!important;width:100%!important;max-height:none!important;overflow-y:visible!important;border:none!important;border-radius:0!important;box-shadow:none!important}
.lil-gui .controller{height:36px!important;margin-bottom:4px!important}
.lil-gui .title{height:44px!important;line-height:44px!important;font-weight:700!important;font-family:'Space Mono',monospace!important;font-size:12px!important;letter-spacing:.05em!important;border-radius:var(--radius-sm)!important;margin-bottom:4px!important}

/* ANALYSIS */
.an-sim-name{font-family:var(--mono);font-size:10px;color:var(--lime);text-transform:uppercase;letter-spacing:.15em;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.overlay-body{font-size:14px;line-height:1.75;color:var(--muted);margin-bottom:14px}
.formula-block{background:rgba(245,245,240,.07);border-left:3px solid var(--chalk);padding:14px 18px;margin:10px 0;font-family:var(--mono);font-size:12px;color:#e8e8e0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;line-height:1.9}
.formula-label{display:block;font-size:9px;color:var(--lime);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
#live-values{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.live-chip{background:rgba(245,245,240,.04);border:1px solid var(--border);border-radius:100px;padding:7px 16px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:8px}
.live-chip span{color:var(--lime);font-weight:700}

/* STUDENT MODE */
body.student-mode #fab-cluster{opacity:0;pointer-events:none;transition:opacity .4s}
body.student-mode #fr-viewmode{display:none!important}
#student-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:90;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;display:none;animation:float 3s ease-in-out infinite}
body.student-mode #student-hint{display:block}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

#transition-overlay{position:absolute;inset:0;background:var(--bg-mid);z-index:500;opacity:0;pointer-events:none;transition:opacity .35s ease}
#transition-overlay.active{opacity:1;pointer-events:all}

/* Loading screen — base styles (fascinating version is in compass-ui.css) */
#loading-screen{position:fixed;inset:0;background:var(--bg-mid);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s}
#loading-screen.fade-out{opacity:0;pointer-events:none}
.ls-logo{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--chalk);letter-spacing:6px}
.ls-tag{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:3px}
.ls-track{width:180px;height:2px;background:rgba(245,245,240,.1);border-radius:1px;overflow:hidden}
.ls-fill{height:100%;background:var(--chalk);border-radius:1px}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* Tablet and phone layouts */
@media (max-width: 760px) {
  :root {
    --topbar-h: 64px;
    --touch-sm: 48px;
    --touch-md: 56px;
    --touch-lg: 62px;
  }
  #top-bar{height:64px;padding:0 13px;gap:9px}
  .tb-logo{font-size:14px;letter-spacing:0.08em;gap:7px}
  .tb-div{height:23px}
  #sim-title{font-size:14px;line-height:1.2}
  #sim-subtitle{display:none}
  #view-badge{padding:5px 8px;font-size:10px}
  #mode-badge{gap:5px;padding:7px 9px;min-height:40px;font-size:10px}
  #fab-cluster{right:13px;bottom:14px;gap:8px}
  .fab-row{gap:8px}
  .fab-lbl{font-size:10px;padding:5px 9px}
  #sim-sheet{bottom:10px;width:calc(100% - 20px);max-height:78dvh;border-radius:16px}
  #sim-grid{padding:10px 12px 20px}
  .sim-tile{min-height:60px;padding:9px 11px;gap:10px}
  .st-icon{width:40px;height:40px}
  .st-name{font-size:14px}
  .st-formula{font-size:10px}
  .drawer{top:auto;bottom:10px;max-height:min(76dvh,620px);border-radius:16px}
  #ctrl-drawer, #info-drawer{left:10px;right:10px;width:auto;transform:translateY(calc(100% + 30px))}
  #ctrl-drawer.open, #info-drawer.open{transform:translateY(0)}
  .drawer-hdr{height:58px;min-height:58px}
  .drawer-body{padding:14px}
}
@media (max-width: 420px) {
  #top-bar{gap:7px;padding:0 9px}
  .tb-logo{font-size:12px;gap:5px}
  .tb-dot{width:6px;height:6px}
  #sim-title{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mode-badge{padding:6px 7px;font-size:9px}
}
</style>

<body>

<!-- =========================================================
     FASCINATING LOADING SCREEN
     - Radial chalkboard spotlight (brighter middle, darker edges)
     - Faint graph paper overlay
     - 22 drifting math symbols
     - Slowly rotating compass-needle SVG behind the logo
     - 4 corner KaTeX equations (Euler, integral, Pythagoras, Basel)
     - COMPASS in chalk, breathing
     - Tagline + chalk-stroke progress bar
     ========================================================= -->
<div id="loading-screen">
  <!-- Slowly rotating compass-needle SVG behind the logo -->
  <svg class="ls-compass-bg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#f5f5f0" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#f5f5f0" stroke-width="0.8" stroke-dasharray="2 6"/>
    <path d="M100 15 L110 100 L100 105 L90 100 Z" fill="#f5f5f0"/>
    <path d="M100 185 L110 100 L100 95 L90 100 Z" fill="rgba(245,245,240,0.4)"/>
    <circle cx="100" cy="100" r="6" fill="#f5f5f0"/>
    <text x="100" y="10" text-anchor="middle" fill="#f5f5f0" font-size="10" font-family="monospace">N</text>
    <text x="100" y="198" text-anchor="middle" fill="#f5f5f0" font-size="10" font-family="monospace">S</text>
    <text x="6" y="104" text-anchor="middle" fill="#f5f5f0" font-size="10" font-family="monospace">W</text>
    <text x="194" y="104" text-anchor="middle" fill="#f5f5f0" font-size="10" font-family="monospace">E</text>
  </svg>

  <!-- 4 corner KaTeX equations -->
  <div class="ls-corner ls-tl" data-tex="e^{i\pi} + 1 = 0"></div>
  <div class="ls-corner ls-tr" data-tex="\int_a^b f(x)\,dx"></div>
  <div class="ls-corner ls-bl" data-tex="a^2 + b^2 = c^2"></div>
  <div class="ls-corner ls-br" data-tex="\sum_{n=1}^{\infty} \tfrac{1}{n^2} = \tfrac{\pi^2}{6}"></div>

  <!-- Center: logo + tagline + progress bar -->
  <div class="ls-center">
    <div class="ls-logo"></div>
    <div class="ls-expansion" data-text="CHARTING MATHS, ONE ANGLE AT A TIME">CHARTING MATHS, ONE ANGLE AT A TIME</div>
    <div class="ls-track"><div class="ls-fill"></div></div>
    <div class="ls-tag">Find your direction in maths.</div>
  </div>
</div>

<div id="info-overlay" class="hidden" style="display:none;"></div>
<canvas id="bg-particles"></canvas>

<div id="app">
  <div id="canvas-container"></div>

  <div id="top-bar">
    <div class="tb-logo"><div class="tb-dot"></div>COMPASS</div>
    <div class="tb-div"></div>
    <div id="sim-title">—</div>
    <div id="sim-subtitle">—</div>
    <div id="view-badge">2D</div>
    <div id="mode-badge" onclick="toggleStudentMode()" class="rh">
      <span id="mode-icon">👨‍🏫</span>
      <span id="mode-label">Teacher</span>
    </div>
  </div>

  <div id="pause-indicator">⏸ PAUSED</div>
  <div id="student-hint">● Touch the board to explore</div>
  <div id="backdrop" onclick="closeAll()"></div>

  <div id="sim-sheet">
    <div class="sh-handle-wrap"><div class="sh-handle"></div></div>
    <div class="sh-header">
      <div class="sh-title">Select Demonstration</div>
      <button class="sh-close rh" onclick="closeSheet()">✕</button>
    </div>
    <div id="sim-grid"></div>
  </div>

  <div id="ctrl-drawer" class="drawer">
    <div class="drawer-hdr">
      <div class="drawer-ttl">⚙ Sim Controls</div>
      <button class="drawer-x rh" onclick="closeCtrl()">✕</button>
    </div>
    <div class="drawer-body" id="ctrl-drawer-body">
      <div id="gui-container"></div>
    </div>
  </div>

  <div id="info-drawer" class="drawer">
    <div class="drawer-hdr">
      <div class="drawer-ttl">📐 Maths Analysis</div>
      <button class="drawer-x rh" onclick="closeAnalysis()">✕</button>
    </div>
    <div class="drawer-body" id="info-drawer-body">
      <div class="an-sim-name" id="overlay-sim-badge">—</div>
      <div class="overlay-body" id="overlay-text"></div>
      <div id="formula-container"></div>
      <div id="energy-container" style="display:none"></div>
      <div id="momentum-container" style="display:none"></div>
      <div id="live-values"></div>
    </div>
  </div>

  <div id="fab-cluster">
    <div class="fab-row" id="fr-sims"><span class="fab-lbl">Simulations</span><button class="fab fab-sec rh" id="fab-sims" onclick="openSheet()">🧪</button></div>
    <div class="fab-row" id="fr-analysis"><span class="fab-lbl">Analysis</span><button class="fab fab-sec rh" id="fab-analysis" onclick="toggleAnalysis()">📐</button></div>
    <div class="fab-row" id="fr-ctrl"><span class="fab-lbl">Controls</span><button class="fab fab-sec rh" id="fab-ctrl" onclick="toggleCtrl()">⚙</button></div>
    <div class="fab-row" id="fr-ghost"><span class="fab-lbl">Motion trail</span><button class="fab fab-sec rh" id="fab-ghost" onclick="toggleGhost()">👻</button></div>
    <div class="fab-row" id="fr-viewmode"><span class="fab-lbl" id="vm-label">Switch view</span><button class="fab fab-sec rh" id="fab-viewmode" onclick="toggleViewMode()">🔲</button></div>
    <div class="fab-row" id="fr-reset"><span class="fab-lbl">Reset</span><button class="fab fab-sec rh" id="fab-reset" onclick="resetSim()">↺</button></div>
    <div class="fab-row" id="fr-pause"><span class="fab-lbl">Pause / Resume</span><button class="fab fab-sec rh" id="fab-pause" onclick="pauseSim()">⏸</button></div>
    <button class="fab fab-main rh" id="fab-main" onclick="toggleFabMenu()">☰</button>
  </div>

  <div id="transition-overlay"></div>
</div>

<script>
document.addEventListener('pointerdown', function(e) {
  var h = e.target.closest('.rh'); if (!h) return;
  var r = document.createElement('span');
  var rect = h.getBoundingClientRect();
  var sz = Math.max(rect.width, rect.height);
  r.className = 'ripple';
  r.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-rect.left-sz/2)+'px;top:'+(e.clientY-rect.top-sz/2)+'px';
  h.appendChild(r);
  r.addEventListener('animationend', function(){r.remove()});
});

var _fabOpen=false, _ctrlOpen=false, _analysisOpen=false, _studentMode=false;

function toggleFabMenu() {
  _fabOpen=!_fabOpen; var btn=document.getElementById('fab-main');
  btn.textContent=_fabOpen?'✕':'☰'; btn.classList.toggle('open',_fabOpen);
  document.querySelectorAll('.fab-sec').forEach(function(f){f.classList.toggle('vis',_fabOpen)});
  document.querySelectorAll('.fab-row').forEach(function(r){r.classList.toggle('vis',_fabOpen)});
}
function openSheet(){document.getElementById('sim-sheet').classList.add('open')}
function closeSheet(){document.getElementById('sim-sheet').classList.remove('open')}
function toggleCtrl(){
  _ctrlOpen=!_ctrlOpen;
  document.getElementById('ctrl-drawer').classList.toggle('open',_ctrlOpen);
  document.getElementById('fab-ctrl').classList.toggle('on',_ctrlOpen);
  if(_ctrlOpen&&_analysisOpen){_analysisOpen=false;document.getElementById('info-drawer').classList.remove('open');document.getElementById('fab-analysis').classList.remove('on')}
}
function closeCtrl(){_ctrlOpen=false;document.getElementById('ctrl-drawer').classList.remove('open');document.getElementById('fab-ctrl').classList.remove('on')}
function toggleAnalysis(){
  _analysisOpen=!_analysisOpen;
  document.getElementById('info-drawer').classList.toggle('open',_analysisOpen);
  document.getElementById('fab-analysis').classList.toggle('on',_analysisOpen);
  if(_analysisOpen&&_ctrlOpen){_ctrlOpen=false;document.getElementById('ctrl-drawer').classList.remove('open');document.getElementById('fab-ctrl').classList.remove('on')}
}
function closeAnalysis(){_analysisOpen=false;document.getElementById('info-drawer').classList.remove('open');document.getElementById('fab-analysis').classList.remove('on')}
function closeAll(){closeSheet();closeCtrl();closeAnalysis()}

function pauseSim(){
  if(window._engine&&window._engine.activeSim){
    window._engine.activeSim.togglePause(); var p=window._engine.activeSim._paused; var btn=document.getElementById('fab-pause');
    btn.classList.toggle('paused',p); btn.textContent=p?'▶':'⏸';
  }
}
function resetSim(){
  if(window._engine&&window._engine.activeSim){
    if(window._engine.activeSim.reset) window._engine.activeSim.reset();
    if(window._engine.activeSim._paused) pauseSim();
  }
  var btn=document.getElementById('fab-reset');btn.style.background='rgba(159,184,159,.2)';btn.style.color='#9fb89f';
  setTimeout(function(){btn.style.background='';btn.style.color=''},300);
}

function toggleGhost(){
  window._ghostEnabled=!window._ghostEnabled;
  document.getElementById('fab-ghost').classList.toggle('ghost-on',window._ghostEnabled);
  if(!window._ghostEnabled && window._engine && window._engine.activeSim){
    if(window._engine.activeSim._clearGhosts) window._engine.activeSim._clearGhosts();
  }
}

function toggleViewMode(){
  /* Phase 1 sims are all 2D — this is a no-op for now but kept for future 3D sims */
  if(!window._engine) return;
  if(window._engine.type === '3d') {
    var next = window._engine.viewMode==='2d'?'3d':'2d';
    window._engine.viewMode = next;
    updateViewModeUI();
  }
}
function updateViewModeUI(){
  var badge = document.getElementById('view-badge');
  if (badge) {
    var m = (window._engine && window._engine.type === '3d' && window._engine.viewMode) ? window._engine.viewMode : '2d';
    badge.textContent = m.toUpperCase();
    badge.className = m==='3d'?'mode-3d':'';
  }
  var vml = document.getElementById('vm-label');
  if (vml) vml.textContent = 'Switch view';
}

function toggleStudentMode(){
  _studentMode=!_studentMode;
  document.body.classList.toggle('student-mode',_studentMode);
  document.getElementById('mode-label').textContent=_studentMode?'Student':'Teacher';
  document.getElementById('mode-icon').textContent=_studentMode?'👨‍🎓':'👨‍🏫';
  document.getElementById('mode-badge').classList.toggle('student',_studentMode);
  if(_studentMode){
    closeAll(); if(_fabOpen) toggleFabMenu();
  }
}

window.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();pauseSim()}
  else if(e.key==='r'||e.key==='R'){e.preventDefault();resetSim()}
  else if(e.key==='h'||e.key==='H'){toggleAnalysis()}
  else if(e.key==='c'||e.key==='C'){toggleCtrl()}
  else if(e.key==='s'||e.key==='S'){openSheet()}
  else if(e.key==='g'||e.key==='G'){toggleGhost()}
  else if(e.key==='Escape'){closeAll()}
});
window.toggleOverlay=toggleAnalysis;
</script>
